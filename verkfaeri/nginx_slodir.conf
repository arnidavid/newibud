# Síðuslóðir sumar.silfran.com – afrit af því sem er í server-blokkinni 'sumar' á VPS
# (/etc/nginx/sites-enabled/sumar), sett inn fyrir ofan „# Main location“.
# Vefurinn teiknar þessar síður sjálfur (app.js les slóðina), svo nginx skilar alltaf index.html.
# Nýr flipi = bæta nafni hans í seinni listann (sama og VIEW_HASH í app.js og SIDUR í verkfaeri/thjonn.py).

    location ~ ^/(eign|gata)/ {
        try_files /index.html =404;
        expires epoch;
    }

    location ~ ^/(yfirlit|hofud|akureyri|reykjanesbaer|selfoss|akranes|skorradalur|grimsnes|blaskogabyggd|markadshiti|verdmat)/?$ {
        try_files /index.html =404;
        expires epoch;
    }
