# Síðuslóðir sumar.silfran.com – afrit af því sem er í server-blokkinni 'sumar' á VPS
# (/etc/nginx/sites-enabled/sumar), sett inn fyrir ofan „# Main location“.
# Vefurinn teiknar þessar síður sjálfur (app.js les slóðina), svo nginx skilar alltaf index.html.
# Nýr flipi = bæta nafni hans í seinni listann (sama og VIEW_HASH í app.js og SIDUR í verkfaeri/thjonn.py).

    location ~ ^/(eign|gata)/ {
        try_files /index.html =404;
        expires epoch;
    }

    location ~ ^/(yfirlit|hofud|akureyri|reykjanesbaer|selfoss|akranes|skorradalur|grimsnes|blaskogabyggd|kjos|hvalfjardarsveit|markadshiti|verdmat)/?$ {
        try_files /index.html =404;
        expires epoch;
    }

# Innri skrár (vefrótin er git-mappan): ekki þjóna þeim. Þarf að vera EFST af regex-blokkunum í
# server-blokkinni (fyrir ofan „# Cache static files“), annars grípur .js/.png-blokkin þær fyrst.
    location ~ ^/(migrations|n8n|verkfaeri|\.claude)(/|$) {
        return 404;
    }
    location ~ ^/(CLAUDE(\.local)?\.md|VERKEFNI\.md|deploy\.sh)$ {
        return 404;
    }
